<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$page_title</title>
<meta name="description" content="$description">
<link rel="canonical" href="$canonical">
<link rel="alternate" type="application/atom+xml" title="$site_title" href="/feed.xml">
<link rel="stylesheet" href="/style.css">
<meta property="og:site_name" content="$site_title">
<meta property="og:title" content="$og_title">
<meta property="og:type" content="$og_type">
<meta property="og:url" content="$canonical">
<meta property="og:description" content="$description">
</head>
<body>
<header class="masthead">
  <a href="/" class="masthead-link"><img src="$header_image" alt="$site_title" width="640" height="120"></a>
  <p class="tagline">$tagline</p>
</header>
<div class="layout">
  <main class="main">
$content
  </main>
  <aside class="sidebar">
$sidebar
  </aside>
</div>
<footer class="site-footer">
  <p>&copy; $year $author &middot; <a href="/feed.xml">Atom feed</a> &middot; <a href="/archive/">Archive</a></p>
</footer>
</body>
</html>
